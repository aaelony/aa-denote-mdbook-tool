[package]
name = "aa-denote-mdbook-tool-core"
description = "Library behind aa-denote-mdbook-tool: Denote file names in an mdBook layout"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
getrandom = "0.3"
pathdiff = "0.2.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["json"] }
urlencoding = "2.1.3"
walkdir = "2.5.0"
