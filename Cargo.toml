[workspace]
members = ["denote-mdbook-core"]
default-members = [".", "denote-mdbook-core"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"

[package]
name = "aa-denote-mdbook-tool"
version.workspace = true
edition.workspace = true

# The installed command name; `init` writes it into book.toml as the preprocessor.
[[bin]]
name = "aa-denote-mdbook-tool"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
aa-denote-mdbook-tool-core = { path = "denote-mdbook-core", version = "0.1.0" }
rmcp = { version = "3.5.1", features = ["transport-io"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
